name: Update Markdown Last Updated

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  update-markdown:
    # Prevent the workflow from running on its own commit
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find changed Markdown files
        id: changed
        shell: bash
        run: |
          FILES=$(git diff --name-only \
            "${{ github.event.before }}" \
            "${{ github.sha }}" \
            -- '*.md')

          {
            echo 'files<<EOF'
            echo "$FILES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Update Last Updated
        if: steps.changed.outputs.files != ''
        shell: bash
        run: |
          DATE=$(date +'%Y-%m-%d')

          while IFS= read -r file; do
            [ -z "$file" ] && continue

            if grep -q "^> Last Updated:" "$file"; then
              echo "Updating $file"

              sed -E -i \
                "s|^> Last Updated: .*|> Last Updated: ${DATE}|" \
                "$file"
            fi
          done <<< "${{ steps.changed.outputs.files }}"

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add '*.md'
          git commit -m "docs: update Last Updated dates"

          git push# This is a basic workflow that is manually triggered
