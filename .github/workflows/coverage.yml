# -----------------------------------------------------------------------------
# Generates PHPUnit code coverage and uploads the results to SonarCloud.
#
# This workflow only runs after code has been merged into the protected
# master branch, avoiding unnecessary GitHub Actions usage for pull requests.
#
# Requirements:
#   - SONAR_TOKEN GitHub Secret
#   - sonar-project.properties configured correctly
# -----------------------------------------------------------------------------

name: Code Coverage

# ---------------------------------------------------------------------------
# Workflow Triggers
# ---------------------------------------------------------------------------
on:
  # Run after changes are merged into the protected master branch.
  # push:
  #   branches:
  #     - master

  # Allow manual execution from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:
  coverage:
    name: PHPUnit Coverage

    # Use the latest Ubuntu runner
    runs-on: ubuntu-latest

    # -----------------------------------------------------------------------
    # Environment Variables
    # -----------------------------------------------------------------------
    # These values are retrieved from GitHub Repository Secrets.
    #
    # Configure them in:
    # GitHub Repository
    #   → Settings
    #   → Secrets and variables
    #   → Actions
    #
    # Do NOT put the actual secret values directly in this file.
    # -----------------------------------------------------------------------
    env:
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      AWS_COGNITO_USER_POOL_ID: ${{ vars.AWS_COGNITO_USER_POOL_ID }}
      AWS_COGNITO_CLIENT_ID: ${{ vars.AWS_COGNITO_CLIENT_ID }}
      AWS_COGNITO_CLIENT_SECRET: ${{ secrets.AWS_COGNITO_CLIENT_SECRET }}
      AUTH_VALID_CREDENTIALS: ${{ vars.AUTH_VALID_CREDENTIALS }}

    steps:

      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Install PHP with Xdebug enabled.
      #
      # Xdebug is used for code coverage in this workflow.
      # ----------------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug
          tools: composer:v2

      # ----------------------------------------------------------
      # Cache Composer downloads
      # ----------------------------------------------------------
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      # ----------------------------------------------------------
      # Install dependencies
      # ----------------------------------------------------------
      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-progress

      # ----------------------------------------------------------
      # Execute PHPUnit
      #
      # Generates:
      #   build/coverage/coverage.xml
      #   build/reports/junit.xml
      # ----------------------------------------------------------
      - name: Run PHPUnit with coverage
        run: |
          mkdir -p build/coverage build/reports

          vendor/bin/phpunit \
            --coverage-clover build/coverage/coverage.xml \
            --log-junit build/reports/junit.xml

      # ----------------------------------------------------------
      # Upload results to SonarCloud
      # ----------------------------------------------------------
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
