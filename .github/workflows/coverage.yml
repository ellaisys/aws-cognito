# -----------------------------------------------------------------------------
# Generates PHPUnit code coverage and uploads the results to SonarCloud.
#
# This workflow only runs after code has been merged into the protected
# master branch, avoiding unnecessary GitHub Actions usage for pull requests.
#
# Requirements:
#   - SONAR_TOKEN GitHub Secret
#   - sonar-project.properties configured correctly
# -----------------------------------------------------------------------------

name: Code Coverage

# ---------------------------------------------------------------------------
# Workflow Triggers
# ---------------------------------------------------------------------------
on:
  # Run after changes are merged into the protected master branch.
  # push:
  #   branches:
  #     - master

  # Allow manual execution from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  code-quality: write

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:
  coverage:
    name: PHPUnit Coverage

    # Use the latest Ubuntu runner
    runs-on: ubuntu-latest

    # -----------------------------------------------------------------------
    # Environment Variables
    # -----------------------------------------------------------------------
    # These values are retrieved from GitHub Repository Secrets.
    #
    # Configure them in:
    # GitHub Repository
    #   → Settings
    #   → Secrets and variables
    #   → Actions
    #
    # Do NOT put the actual secret values directly in this file.
    # -----------------------------------------------------------------------
    env:
      AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      AWS_COGNITO_REGION: ${{ vars.AWS_COGNITO_REGION }}
      AWS_COGNITO_USER_POOL_ID: ${{ vars.AWS_COGNITO_USER_POOL_ID }}
      AWS_COGNITO_CLIENT_ID: ${{ vars.AWS_COGNITO_CLIENT_ID }}
      AWS_COGNITO_CLIENT_SECRET: ${{ secrets.AWS_COGNITO_CLIENT_SECRET }}
      AUTH_VALID_CREDENTIALS: ${{ vars.AUTH_VALID_CREDENTIALS }}

    steps:

      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ----------------------------------------------------------
      # Install PHP with Xdebug enabled.
      #
      # Xdebug is used for code coverage in this workflow.
      # ----------------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ vars.PHP_VERSION }}

          # PHP extensions required by the package/tests.
          extensions: mbstring, bcmath, gmp, curl, xml, libxml, dom

          # Use Composer v2.
          tools: composer:v2

          # Code coverage is enabled.
          coverage: xdebug

      # ----------------------------------------------------------
      # Cache Composer downloads
      # ----------------------------------------------------------
      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      # ----------------------------------------------------------
      # Install dependencies
      # ----------------------------------------------------------
      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-progress

      # ----------------------------------------------------------
      # Execute PHPUnit
      #
      # Generates:
      #   build/coverage/coverage.xml
      #   build/reports/junit.xml
      # ----------------------------------------------------------
      - name: Run PHPUnit with coverage
        run: |
          mkdir -p build/coverage build/reports

          vendor/bin/phpunit \
            --exclude-group=make-command \
            --coverage-clover build/coverage/coverage.xml \
            --coverage-cobertura build/coverage/cobertura.xml \
            --coverage-html build/coverage/html \
            --log-junit build/reports/junit.xml

      # ----------------------------------------------------------
      # Preserve PHPUnit Report
      # ----------------------------------------------------------
      - name: Preserve PHPUnit Report
        uses: actions/upload-artifact@v7
        with:
          name: phpunit-report
          path: build/**
          retention-days: 7

      # ----------------------------------------------------------
      # Fix PHPUnit coverage paths
      # ----------------------------------------------------------
      - name: Fix PHPUnit coverage paths
        run: |
          sed -i 's|/home/runner/work/aws-cognito/aws-cognito/|/github/workspace/|g' build/coverage/coverage.xml

      # ----------------------------------------------------------
      # Upload results to SonarCloud
      # ----------------------------------------------------------
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # ----------------------------------------------------------
      # Upload results to GitHub Code Quality - Code Coverage
      # ----------------------------------------------------------
      - name: Upload coverage report
        uses: actions/upload-code-coverage@v1
        with:
          file: build/coverage/cobertura.xml
          language: PHP
          label: code-coverage/phpunit
