# -----------------------------------------------------------------------------
# Generates PHPUnit code coverage and uploads the results to SonarCloud.
#
# This workflow only runs after code has been merged into the protected
# master branch, avoiding unnecessary GitHub Actions usage for pull requests.
#
# Requirements:
#   - SONAR_TOKEN GitHub Secret
#   - sonar-project.properties configured correctly
# -----------------------------------------------------------------------------

name: Code Coverage

on:
  # Run after changes are merged into the protected master branch.
  push:
    branches:
      - master

  # Allow manual execution from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: PHPUnit Coverage

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------------
      # Checkout repository
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Install PHP with PCOV enabled.
      #
      # PCOV is significantly faster than Xdebug for code coverage.
      # ----------------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2

      # ----------------------------------------------------------
      # Cache Composer downloads
      # ----------------------------------------------------------
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      # ----------------------------------------------------------
      # Install dependencies
      # ----------------------------------------------------------
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # ----------------------------------------------------------
      # Execute PHPUnit
      #
      # Generates:
      #   build/coverage/clover.xml
      #   build/reports/junit.xml
      # ----------------------------------------------------------
      - name: Run PHPUnit with coverage
        run: |
          mkdir -p build/coverage build/reports

          vendor/bin/phpunit \
            --coverage-clover build/coverage/clover.xml \
            --log-junit build/reports/junit.xml

      # ----------------------------------------------------------
      # Upload results to SonarCloud
      # ----------------------------------------------------------
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
